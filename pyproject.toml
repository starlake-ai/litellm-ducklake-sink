[project]
name = "litellm-ducklake-sink"
version = "0.1.0"
description = "LiteLLM proxy logging callback that appends request telemetry to DuckLake tables through a QoD Flight SQL endpoint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.90.0",
    "adbc-driver-flightsql>=1.4.0,<2.0",
    "adbc-driver-manager>=1.4.0,<2.0",
    "pyarrow>=18.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["litellm_ducklake_sink"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
